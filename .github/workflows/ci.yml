name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packaging/build_deb.py --homepage "https://github.com/${{ github.repository }}"
      - run: dpkg-deb -I dist/rmon_*_all.deb && dpkg-deb -c dist/rmon_*_all.deb | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: rmon-deb
          path: dist/
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse obvious secrets and personal data
        run: |
          if grep -rInE "(sk|pk)-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----" --exclude-dir=.git --exclude-dir=tests --exclude=canary.py .; then
            echo "possible secret committed"; exit 1; fi
